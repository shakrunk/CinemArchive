name: Android

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  # Push runs cover direct commits to dev only. Everything reaching main has
  # already passed this job on its pull request, so re-running it there is waste.
  push:
    branches: [dev]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:lintDebug testDebugUnitTest
