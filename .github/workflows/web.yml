name: Web

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    # Do not inherit developer .env values or require production secrets for PRs.
    env:
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npm run test
      # Development-tooling advisories are tracked separately in #278.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Retain browser report and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-browser-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
