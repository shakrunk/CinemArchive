name: Web

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    # Do not inherit developer .env values or require production secrets for PRs.
    env:
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Test release version encoding
        working-directory: .
        run: node --test scripts/release-version.test.mjs
      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npm run test
      # Development-tooling advisories are tracked separately in #278.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      # Browser binaries only change with the Playwright version, so most runs skip the download.
      - name: Cache browser engines
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # WebKit and Firefox need OS libraries from apt. When the runner's Ubuntu mirror crawls,
      # this used to trickle packages until the 15-minute job timeout cancelled the whole run,
      # after every test had passed. Each attempt is capped instead, and retried; a healthy
      # install takes under 80 s.
      - name: Install browser OS dependencies
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
          for attempt in 1 2 3; do
            if timeout 240 npx --no-install playwright install-deps chromium firefox webkit; then
              exit 0
            fi
            echo "::warning::Browser OS dependency install attempt $attempt failed or timed out; retrying"
            # timeout stops npx, not the apt it started under sudo; clear it before retrying.
            # [a]: keeps the pattern from matching this pkill's own sudo wrapper.
            sudo pkill -f '[a]pt-get' || true
            sudo dpkg --configure -a || true
            sleep 5
          done
          exit 1
      - name: Install browser engines
        timeout-minutes: 5
        run: npx --no-install playwright install chromium firefox webkit
      - run: npm run test:e2e
      - name: Retain browser report and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-browser-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
