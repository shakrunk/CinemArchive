name: Web

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    defaults:
      run:
        working-directory: apps/web
    # Do not inherit developer .env values or require production secrets for PRs.
    env:
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Test release version encoding
        working-directory: .
        run: node --test scripts/release-version.test.mjs
      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npm run test
      # Development-tooling advisories are tracked separately in #278.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      # The browser jobs run in the Playwright image built for exactly this version.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

  # One job per browser engine, so a failing engine doesn't hold up the others and "Re-run
  # failed jobs" re-runs just that engine instead of the whole check.
  #
  # Each runs in Playwright's own image for the lockfile's Playwright version, which ships every
  # browser and its OS libraries. Installing those with apt on the runner depended on the Ubuntu
  # mirror, which regularly crawled for minutes and could outlast the job timeout. --user 1001
  # is the runner's own user (Playwright's documented setup), so the workspace stays writable
  # and Firefox isn't run as root.
  browser:
    name: Browser tests (${{ matrix.engine }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.verify.outputs.playwright }}-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Chromium projects share one engine.
          - engine: chromium
            projects: --project=chromium --project=mobile-chromium
          - engine: firefox
            projects: --project=firefox
          - engine: webkit
            projects: --project=webkit
    defaults:
      run:
        working-directory: apps/web
    env:
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:e2e -- ${{ matrix.projects }}
      - name: Retain browser report and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-browser-report-${{ matrix.engine }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
